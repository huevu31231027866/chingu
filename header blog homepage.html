<style>
/* --- CSS CHO BLOG HEADER MỚI (NỀN ĐEN MỜ, FULL CẠNH) --- */
.chingu-blog-hero {
    /* Đổi sang lớp phủ màu đen nguyên bản với độ mờ 60% */
    background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url(https://steelblue-otter-840197.hostingersite.com/wp-content/uploads/2026/05/gradient-traditional-korean-food-sale-banner-template_23-2149650345.png);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 90px 20px; /* Tăng padding xíu cho thoáng */
    text-align: center;
    /* Đã xóa border-bottom và border-radius theo yêu cầu */
    margin-bottom: 40px;
}

.chingu-blog-hero h1 {
    font-family: 'Kodchasan', sans-serif;
    color: #ffd150; 
    font-size: 46px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 15px;
    letter-spacing: 2px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5); /* Tăng độ bóng đen để chữ tách biệt hẳn khỏi nền */
}

.chingu-blog-hero p {
    font-family: 'League Spartan', sans-serif;
    color: #fff6e7; 
    font-size: 18px;
    max-width: 650px;
    margin: 0 auto;
    line-height: 1.6;
    opacity: 0.95;
}

/* --- TỰ ĐỘNG CĂN CHỈNH TRÊN ĐIỆN THOẠI --- */
@media (max-width: 768px) {
    .chingu-blog-hero { 
        padding: 50px 15px; 
    }
    .chingu-blog-hero h1 { 
        font-size: 32px; 
    }
    .chingu-blog-hero p { 
        font-size: 16px; 
    }
}
</style>

<!-- --- NỘI DUNG HTML --- -->
<div class="chingu-blog-hero">
    <h1>Chuyện Của Chingu</h1>
    <p>Khám phá văn hóa ẩm thực chuẩn Seoul, những mẹo nướng thịt ngon đỉnh cao và cập nhật các chương trình ưu đãi mới nhất từ chúng tôi.</p>
</div>
